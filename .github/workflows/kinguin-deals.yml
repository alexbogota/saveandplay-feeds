name: Kinguin deals

# Every morning at 03:30 Bogota time (before the main site updates its prices at 04:30), and by hand:
# GitHub -> Actions -> "Kinguin deals" -> Run workflow.
# It reads the Kinguin product feed (Admitad), keeps the PC games whose key is clearly cheaper than the current Steam price,
# checks them on Steam (reviews, content flags) and saves data/kinguin.json. The main site reads that small file.
# The run page (Summary) shows how many products dropped out at every step.
# The access key comes from GitHub Secrets (ADMITAD_FEED_USER, ADMITAD_FEED_CODE) and is never printed or saved.
# This repository is public on purpose: Actions minutes are free and unlimited here.
on:
  schedule:
    - cron: '30 8 * * *' # 08:30 UTC = 03:30 Bogota
  workflow_dispatch:

permissions:
  contents: write # to save data/kinguin.json to main

concurrency:
  group: kinguin-deals
  cancel-in-progress: false

jobs:
  deals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the Kinguin deals
        env:
          ADMITAD_FEED_USER: ${{ secrets.ADMITAD_FEED_USER }}
          ADMITAD_FEED_CODE: ${{ secrets.ADMITAD_FEED_CODE }}
        run: node scripts/kinguin-deals.mjs

      - name: Save the result
        run: |
          git config user.name "saveandplay-bot"
          git config user.email "bot@saveandplay.com"
          git add data/kinguin.json data/steam-cache.json reports/kinguin-summary.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Kinguin deals $(date -u +%F)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
